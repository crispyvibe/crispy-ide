[package]
name = "crispyvibes-external-sessions"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "crispyvibes-external-sessions-helper"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

