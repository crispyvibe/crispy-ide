[package]
name = "crispyvibes-cli"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "crispy"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.5.20", features = ["derive"] }
serde = { version = "=1.0.215", features = ["derive"] }
serde_json = "=1.0.132"
uuid = { version = "=1.11.0", features = ["v4"] }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
