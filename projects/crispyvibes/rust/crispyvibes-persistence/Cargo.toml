[package]
name = "crispyvibes-persistence"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "crispyvibes-persistence-helper"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libsql = { version = "0.9.30", features = ["encryption"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "io-util", "io-std", "macros"] }
zeroize = "1"
