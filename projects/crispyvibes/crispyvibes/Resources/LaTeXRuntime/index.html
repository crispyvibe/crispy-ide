<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!--
    Offline LaTeX WYSIWYG editor host.
    CSP: everything loads from the bundle over file:// (origin 'self'); there is
    no network origin and no inline/eval script (bridge is externalized to
    latex-bridge.js). `style-src 'unsafe-inline'` is required because KaTeX emits
    inline style attributes on the spans it generates (and this page uses a
    <style> block); KaTeX itself needs no eval.
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; base-uri 'none';">
  <link rel="stylesheet" href="katex.min.css">
  <style>
    :root { color-scheme: light dark; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: transparent;
      color: #1d1d1f;
      font: 15px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    }
    body.dark { color: #e6e6e6; }
    #content {
      box-sizing: border-box;
      max-width: 820px;
      margin: 0 auto;
      padding: 28px 32px 160px;
      outline: none;
      min-height: 100%;
    }
    #content:focus { outline: none; }
    #content p { margin: 0 0 0.9em; }
    .atom { user-select: none; }
    /* Editable blocks */
    .blk { margin: 0 0 0.9em; }
    .blk-edit { outline: none; border-radius: 5px; padding: 1px 3px; }
    .blk-edit:focus { background: rgba(120, 140, 255, 0.07); }
    #content h1, #content h2, #content h3, #content h4, #content h5 {
      margin: 1.2em 0 0.4em;
      line-height: 1.25;
      font-weight: 650;
    }
    #content h2 { font-size: 1.6em; }
    #content h3 { font-size: 1.3em; }
    #content h4 { font-size: 1.1em; }
    #content h5 { font-size: 1em; opacity: 0.85; }
    #content ul, #content ol { margin: 0.4em 0; padding-left: 1.6em; }
    #content li { margin: 0.2em 0; }
    #content code {
      font: 0.92em ui-monospace, SFMono-Regular, Menlo, monospace;
      background: rgba(135, 145, 175, 0.16);
      padding: 0.1em 0.35em;
      border-radius: 4px;
    }
    /* Display math block — read-only, click to edit */
    .blk-dmath {
      cursor: pointer;
      border-radius: 6px;
      padding: 6px 10px;
      transition: background 0.12s;
    }
    .blk-dmath:hover { background: rgba(120, 140, 255, 0.12); }
    /* Inline math — read-only atom inside prose, click to edit */
    .math-inline { cursor: pointer; border-radius: 3px; }
    .math-inline:hover { background: rgba(120, 140, 255, 0.18); }
    /* Display math inside prose — read-only atom, click to edit */
    .math-display { cursor: pointer; border-radius: 6px; transition: background 0.12s; }
    .math-display:hover { background: rgba(120, 140, 255, 0.12); }
    /* LaTeX comments: preserved in source, not shown (they don't render) */
    .blk-comment { display: none; }
    /* \maketitle — rendered title block (read-only, generated) */
    .blk-title { text-align: center; margin: 0.5em 0 1.6em; }
    .blk-title .doc-title { font-size: 2em; font-weight: 700; margin: 0 0 0.3em; }
    .blk-title .doc-author { font-size: 1.15em; margin: 0.1em 0; }
    .blk-title .doc-date { opacity: 0.7; margin-top: 0.3em; }
    /* Preserved source we don't model (preamble lives outside; unknown envs) */
    .blk-raw {
      margin: 0.8em 0;
      border-left: 3px solid rgba(135, 145, 175, 0.4);
      border-radius: 0 6px 6px 0;
      background: rgba(135, 145, 175, 0.08);
    }
    .blk-raw pre {
      margin: 0;
      padding: 8px 12px;
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap;
      word-break: break-word;
      opacity: 0.7;
    }
    .blk-blank { height: 0; margin: 0; }
    /* Rendered scholarly environments */
    .blk-abstract { margin: 1.2em 0; font-size: 0.95em; }
    .blk-abstract::before { content: "Abstract"; display: block; font-weight: 700; margin-bottom: 0.3em; }
    .blk-keywords { margin: 0.8em 0; font-size: 0.95em; }
    .blk-keywords::before { content: "Index Terms\2014"; font-weight: 700; font-style: italic; margin-right: 0.3em; }
    .blk-table { margin: 1.2em 0; padding: 0 8px; text-align: center; }
    .tex-caption { font-size: 0.9em; opacity: 0.8; margin-bottom: 0.5em; }
    .tex-table { border-collapse: collapse; margin: 0 auto; }
    .tex-table td { border-bottom: 1px solid rgba(135, 145, 175, 0.4); padding: 4px 14px; text-align: center; }
    .tex-table tr:first-child td { border-bottom-width: 2px; font-weight: 600; }
    .blk-bib { margin: 1.2em 0; padding: 0 8px; }
    .blk-bib .env-label { font-weight: 700; margin-bottom: 0.4em; }
    .tex-bib { font-size: 0.9em; margin: 0; padding-left: 1.6em; }
    .tex-bib li { margin: 0.25em 0; }
    .doc-author { line-height: 1.5; }
    .katex { font-size: 1.05em; }
    .katex-display { margin: 0.6em 0; }
    /* Visual equation editor panel */
    .math-panel {
      z-index: 9999;
      width: 340px;
      max-width: calc(100vw - 16px);
      background: #1e1e1e;
      color: #eee;
      border: 1px solid rgba(120, 140, 255, 0.5);
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      padding: 10px;
    }
    .math-panel-preview {
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      color: #111;
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 8px;
      overflow-x: auto;
    }
    .math-panel-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 4px;
      margin-bottom: 8px;
    }
    .math-panel-key {
      font-size: 15px;
      padding: 6px 0;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.06);
      color: #eee;
      cursor: pointer;
    }
    .math-panel-key:hover { background: rgba(120, 140, 255, 0.3); }
    .math-panel-field {
      width: 100%;
      box-sizing: border-box;
      font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: #141414;
      color: #cfd2ff;
      resize: vertical;
      min-height: 30px;
      outline: none;
    }
    .math-panel-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
    .math-panel-actions button {
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.06);
      color: #eee;
      cursor: pointer;
    }
    .math-panel-done { background: rgba(120, 140, 255, 0.55) !important; border-color: rgba(120, 140, 255, 0.8) !important; }
    #placeholder { opacity: 0.4; }
  </style>
</head>
<body spellcheck="true">
  <div id="content"><div id="placeholder">LaTeX preview</div></div>
  <script src="katex.min.js"></script>
  <script src="auto-render.min.js"></script>
  <script src="latex-bridge.js"></script>
</body>
</html>
